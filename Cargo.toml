[workspace]
resolver = "2"
members = [
    "crates/covert-core",
    "crates/covert-storage",
    "crates/covert-auth",
    "crates/covert-autotype",
    "crates/covert-sentinel",
    "crates/covert-gui",
    "crates/covert-ssh",
    "crates/covert-native-msg",
    "crates/covert-cli",
    "crates/e2e-tests",
]

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.test]
opt-level = 2

