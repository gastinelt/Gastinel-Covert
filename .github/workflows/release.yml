name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    env:
      # Optional Authenticode signing. Set these repository secrets to enable the signing step:
      #   WINDOWS_CERT_BASE64   - base64 of your code-signing .pfx
      #   WINDOWS_CERT_PASSWORD - the .pfx password
      # When they are unset, the binaries are published unsigned.
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Sign binaries (optional)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("cert.pfx", [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          foreach ($exe in @("target/release/covert-gui.exe", "target/release/covert-cli.exe")) {
            & signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $exe
          }
          Remove-Item cert.pfx

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/covert-gui.exe dist/
          Copy-Item target/release/covert-cli.exe dist/
          Copy-Item README.md, LICENSE, SECURITY.md dist/
          Compress-Archive -Path dist/* -DestinationPath "gastinel-covert-$ver-windows-x64.zip"
          Get-FileHash "gastinel-covert-$ver-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  gastinel-covert-$ver-windows-x64.zip" } |
            Out-File -Encoding ascii "gastinel-covert-$ver-windows-x64.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gastinel-covert-windows-x64
          path: |
            gastinel-covert-*-windows-x64.zip
            gastinel-covert-*-windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gastinel-covert-*-windows-x64.zip
            gastinel-covert-*-windows-x64.zip.sha256
          generate_release_notes: true
