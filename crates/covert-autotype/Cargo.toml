[package]
name = "covert-autotype"
version = "0.1.0"
edition = "2021"

[dependencies]
covert-core = { path = "../covert-core" }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
thiserror = "2.0"
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_DataExchange",
] }
