[package]
name = "covert-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
covert-core = { path = "../covert-core" }
covert-storage = { path = "../covert-storage" }
subtle = "2.6"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
secrecy_v08 = { package = "secrecy", version = "0.8" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
argon2 = { version = "0.5", features = ["alloc", "zeroize", "password-hash"] }
rand_core = { version = "0.6", features = ["std"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
]
