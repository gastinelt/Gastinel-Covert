[package]
name = "covert-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
covert-core = { path = "../covert-core" }
covert-storage = { path = "../covert-storage" }
covert-auth = { path = "../covert-auth" }
covert-autotype = { path = "../covert-autotype" }
covert-sentinel = { path = "../covert-sentinel" }
covert-ssh = { path = "../covert-ssh" }
covert-native-msg = { path = "../covert-native-msg" }
clap = { version = "4.5", features = ["derive"] }
secrecy = "0.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_core = { version = "0.6", features = ["std"] }
# Saisie de mot de passe sans echo du terminal. Version exacte epinglee
# (7.3.1, publiee en 2023, bien plus de 2 semaines d'anciennete).
rpassword = "=7.3.1"
