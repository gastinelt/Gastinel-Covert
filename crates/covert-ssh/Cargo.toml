[package]
name = "covert-ssh"
version = "0.1.0"
edition = "2021"

[dependencies]
covert-core = { path = "../covert-core" }
covert-sentinel = { path = "../covert-sentinel" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "rand_core", "pkcs8"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
base64ct = { version = "1.8", features = ["alloc"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_IO",
]
