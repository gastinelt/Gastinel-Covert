[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
covert-core = { path = "../covert-core" }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
argon2 = { version = "0.5", features = ["alloc", "zeroize"] }
rand_core = { version = "0.6", features = ["std"] }
ciborium = "0.2"
serde = { version = "1.0", features = ["derive", "alloc"] }
zeroize = { version = "1.8", features = ["derive", "alloc"] }
secrecy = { version = "0.8", features = ["serde"] }
subtle = "2.5"
thiserror = "2.0"
