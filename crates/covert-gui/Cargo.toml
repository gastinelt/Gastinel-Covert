[package]
name = "covert-gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
covert-core = { path = "../covert-core" }
covert-storage = { path = "../covert-storage" }
covert-auth = { path = "../covert-auth" }
covert-autotype = { path = "../covert-autotype" }
covert-sentinel = { path = "../covert-sentinel" }
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
